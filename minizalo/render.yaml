services:
  - type: web
    name: mld-api
    runtime: node
    branch: develop
    rootDir: minizalo/backend
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ZALO_APP_ID
        sync: false
      - key: ZALO_APP_SECRET
        sync: false
      - key: ZALO_RELAY_URL
        sync: false
      - key: ZALO_RELAY_SECRET
        sync: false
      - key: ZALO_ALLOW_SIGNUP
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
